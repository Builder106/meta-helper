[project]
name = "metahelper"
version = "0.1.0"
description = "Meta-helper automation and API integration service."
authors = [
    {name = "Builder106", email = "vaughanolayinka@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    # Python dependencies are now only for scripts/tools, not the main backend
    # The backend is Java 21 + Spring Boot 3
    "requests>=2.32.5",  # For any Python helper scripts
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff",
]

[tool.uv]
package = false
default-groups = []

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"