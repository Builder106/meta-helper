[project]
name = "metahelper"
version = "0.1.0"
description = "Meta-helper automation and API integration service."
authors = [
    {name = "Builder106", email = "vaughanolayinka@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiohttp>=3.13.2",
    "click>=8.3.1",
    "edge-tts>=6.1.15",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.187.0",
    "google-genai>=1.2.0",
    "google-generativeai>=0.8.3",
    "httpx>=0.27.2",
    "pillow>=12.0.0",
    "pydantic>=2.12.5",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
    "uvicorn>=0.31.0",
    "websockets>=14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[tool.uv]
package = false
default-groups = []

[tool.setuptools]
py-modules = []
