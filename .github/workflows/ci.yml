name: CI

# MetaHelper CI — an AI programming assistant for Meta Ray-Ban glasses.
# Backend: Spring Boot 4 (Java 26) vision -> speech pipeline (the gating job).
# Android: Kotlin + Jetpack Compose app that talks to the backend; its build
# needs the Meta Wearables SDK from GitHub Packages, so it only runs once the
# GH_PACKAGES_TOKEN secret (a PAT with read:packages) is configured.
# Shared: Kotlin Multiplatform module with shared business logic.
# iOS: Compose Multiplatform app (macOS runner required for CocoaPods).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so only the latest commit is verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  # ---------------------------------------------------------------------------
  # Backend — always runs and gates the workflow. Must be green on a fresh repo.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Spring Boot / Java 26)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Spring Boot unit tests
        working-directory: ./backend
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification --warning-mode fail

  # ---------------------------------------------------------------------------
  # Shared — Kotlin Multiplatform module. Runs on macOS for CocoaPods/iOS targets.
  # ---------------------------------------------------------------------------
  shared:
    name: Shared (KMP)
    needs: [secrets, backend]
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build shared module (all targets)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :shared:assemble --warning-mode fail

  # ---------------------------------------------------------------------------
  # Android — Kotlin + Jetpack Compose. The Meta Wearables SDK is resolved from
  # GitHub Packages, which requires auth. Without the GH_PACKAGES_TOKEN secret
  # the build cannot resolve the SDK, so the job cleanly skips its real work
  # (and succeeds) instead of failing the workflow with a red X.
  #
  # `if:` can't read secrets directly, so we project the secret's presence into
  # a job-level env var and gate each meaningful step on it.
  # ---------------------------------------------------------------------------
  android:
    name: Android (Kotlin / Jetpack Compose)
    needs: [secrets, backend]
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      HAS_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN != '' && 'true' || 'false' }}
    steps:
      - name: Notice when the Meta SDK token is absent
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice title=Android build skipped::The Android build is skipped until the GH_PACKAGES_TOKEN secret is configured."
          echo "The Meta Wearables SDK (com.meta.wearable:mwdat-*) is published to GitHub Packages"
          echo "at https://maven.pkg.github.com/facebook/meta-wearables-dat-android and requires auth."
          echo "Add a repository secret named GH_PACKAGES_TOKEN — a GitHub PAT with the read:packages"
          echo "scope — and this job will build and test the Android app on the next run."

      - name: Check out repository
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        if: env.HAS_TOKEN == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: env.HAS_TOKEN == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Android lint
        if: env.HAS_TOKEN == 'true'
        working-directory: ./android
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew lintDebug --warning-mode fail

      - name: Run unit tests and assemble debug APK
        if: env.HAS_TOKEN == 'true'
        working-directory: ./android
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew testDebugUnitTest assembleDebug --warning-mode fail

      - name: Enable KVM
        if: env.HAS_TOKEN == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        if: env.HAS_TOKEN == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: cd android && ./gradlew connectedCheck --warning-mode fail

  # ---------------------------------------------------------------------------
  # iOS — Compose Multiplatform app. Requires macOS for Xcode/CocoaPods.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (Compose Multiplatform)
    needs: [secrets, backend]
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build iOS app
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvmargs=-Xmx6g"
        run: ./gradlew :shared:assemble --warning-mode fail || ./gradlew assemble --warning-mode fail
