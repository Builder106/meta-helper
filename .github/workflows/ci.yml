name: CI

# MetaHelper CI — an AI programming assistant for Meta Ray-Ban glasses.
# Backend: Spring Boot 4 (Java 26) vision -> speech pipeline (the gating job).
# Android: Kotlin + Jetpack Compose app that talks to the backend; its build
# needs the Meta Wearables SDK from GitHub Packages, so it only runs once the
# GH_PACKAGES_TOKEN secret (a PAT with read:packages) is configured.
# Shared: Kotlin Multiplatform module with shared business logic.
# iOS: Compose Multiplatform app (macOS runner required for CocoaPods).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so only the latest commit is verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  # ---------------------------------------------------------------------------
  # Backend — always runs and gates the workflow. Must be green on a fresh repo.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Spring Boot / Java 26)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Spring Boot unit tests
        working-directory: ./backend
        run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification --warning-mode fail

  # ---------------------------------------------------------------------------
  # Shared — Kotlin Multiplatform module. Runs on macOS for CocoaPods/iOS targets.
  # ---------------------------------------------------------------------------
  shared:
    name: Shared (KMP)
    needs: [secrets, backend]
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build shared module (all targets)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :shared:assemble --warning-mode fail

  # ---------------------------------------------------------------------------
  # Android — Kotlin + Jetpack Compose. The package token is required because
  # the Meta Wearables SDK is resolved from GitHub Packages. Missing credentials
  # are a configuration failure, not a reason to skip this gate.
  # ---------------------------------------------------------------------------
  android:
    name: Android (Kotlin / Jetpack Compose)
    needs: [secrets, backend]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android lint
        working-directory: ./android
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :app:lintDebug --warning-mode fail

      - name: Run unit tests and assemble debug APK
        working-directory: ./android
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --warning-mode fail

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: cd android && ./gradlew connectedCheck --warning-mode fail

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meta-helper-android-test-results
          path: |
            android/app/build/reports/androidTests/connected/debug
            android/app/build/outputs/androidTest-results/connected/debug
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: meta-helper-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS — Compose Multiplatform app. Requires macOS for Xcode/CocoaPods.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (Compose Multiplatform)
    needs: [secrets, backend]
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build iOS app
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvmargs=-Xmx6g"
        run: ./gradlew :shared:assemble --warning-mode fail || ./gradlew assemble --warning-mode fail
