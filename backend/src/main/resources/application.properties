spring.application.name=metahelper

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

google.api.key=${GOOGLE_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
audio.amplitude.multiplier=${AUDIO_AMPLITUDE_MULTIPLIER:0.1}
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:}
azure.speech.voice=${AZURE_SPEECH_VOICE:en-US-GuyNeural}
