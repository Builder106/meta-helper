plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.metahelper.app'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.metahelper.app"
        minSdk = 29
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    buildFeatures {
        compose = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.1'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        // Let plain JVM unit tests call android.util.Log etc. (return 0/null
        // instead of throwing "not mocked"), so we can test pure logic without
        // pulling in Robolectric.
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError = false
        warningsAsErrors = false
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        allWarningsAsErrors = true
    }
}

dependencies {
    implementation project(':shared')

    // Meta Wearables SDK (DAT) — core only, for connection/registration state.
    // Capture is driven by GalleryWatcher, so the camera (StreamSession) artifact
    // is not needed; re-add 'com.meta.wearable:mwdat-camera:0.3.0' if/when the
    // SDK direct-capture path is revived (requires a registered APPLICATION_ID).
    implementation 'com.meta.wearable:mwdat-core:0.3.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation platform('androidx.compose:compose-bom:2026.08.00')
    testImplementation 'androidx.compose.runtime:runtime'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

